<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>git — devhub</title>
<script src="/shared/rebuild-reload.js"></script>
<script src="/shared/dom.js"></script>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/tools/git/git.css">
</head>
<body>
<div class="toast-container" id="toast-container"></div>

<header>
  <a href="/" class="hub-link">← Hub</a>
  <div class="divider"></div>
  <h1>git</h1>
  <div class="header-controls">
    <div class="repo-switcher" id="repo-switcher">
      <button class="repo-switcher-btn" id="repo-switcher-btn" type="button" title="リポジトリを選択 / 検索 / 並び替え / 非表示">
        <span id="repo-current-name">Select Repo...</span>
        <span class="caret">▾</span>
      </button>
      <div class="repo-switcher-panel" id="repo-switcher-panel">
        <input type="text" id="repo-search" placeholder="リポジトリを検索..." spellcheck="false" autocomplete="off">
        <div class="repo-switcher-list" id="repo-switcher-list"></div>
        <div class="repo-hidden-wrap" id="repo-hidden-wrap"></div>
      </div>
    </div>
    <button class="btn-icon" id="btn-fetch" title="Fetch（git fetch --prune）">⬇</button>
    <button class="btn-icon" id="btn-remove-repo" title="このリポジトリを非表示にする（後で『非表示』から戻せます）">✕</button>
    <button class="btn-icon" id="btn-add-repo" title="リポジトリを追加">＋</button>
    <button class="btn-icon" id="btn-refresh" title="Refresh">↻</button>
    <button class="btn-icon" id="btn-settings" title="Settings">⚙</button>
  </div>
</header>

<div class="add-repo-panel" id="add-repo-panel">
  <div class="add-repo-picker">
    <span class="picker-hint">パスを直接入力するか、下のディレクトリブラウザからリポジトリを選択してください</span>
    <button class="btn-icon" id="btn-close-add-panel" title="閉じる" style="margin-left:auto;">✕</button>
  </div>
  <div class="add-repo-path-bar">
    <button class="btn-icon" id="btn-dir-up" title="上の階層へ" style="width:26px;height:26px;font-size:13px;">↑</button>
    <input type="text" id="path-input" placeholder="パスを入力して Enter で移動  (例: ~/projects, C:\repos)" spellcheck="false">
    <button class="path-action" id="btn-path-add" title="このパスをリポジトリとして追加">＋ 追加</button>
  </div>
  <div id="add-repo-msg" class="add-repo-msg"></div>
  <div class="add-repo-dir-list" id="add-repo-dir-list"></div>
</div>

<div class="settings-panel" id="settings-panel">
  <div class="settings-col">
    <div class="settings-title">General</div>
    <div class="setting-row">
      <label>Default Repo:</label>
      <select id="setting-default-repo"></select>
    </div>
    <div class="setting-row">
      <label>Log Limit:</label>
      <input type="number" id="setting-log-limit" style="width: 80px;">
    </div>
    <div class="setting-row">
      <label>Local Poll (sec):</label>
      <input type="number" id="setting-local-poll" style="width: 80px;" min="1">
      <label style="margin-left: 8px;"><input type="checkbox" id="setting-local-poll-auto"> Auto</label>
    </div>
    <div class="setting-row">
      <label>Remote Poll (sec):</label>
      <input type="number" id="setting-remote-poll" style="width: 80px;" min="1">
      <label style="margin-left: 8px;"><input type="checkbox" id="setting-remote-poll-auto"> Auto</label>
    </div>
    <div class="setting-row">
      <label><input type="checkbox" id="setting-show-log"> Show Log Panel</label>
    </div>
  </div>
  <div class="settings-col">
    <div class="settings-title">Commit Template</div>
    <textarea id="setting-commit-template" rows="3" style="width: 200px;"></textarea>
  </div>
  <div class="settings-col" id="setting-keybindings-container">
    <div class="settings-title">Keybindings</div>
    <!-- Dynamically generated -->
  </div>
  <div class="settings-col" style="justify-content: flex-end;">
      <a href="/workspace" style="color: var(--muted); font-size: 11px; text-decoration: none; margin-bottom: 6px;" title="スキャン対象フォルダの管理">⚙ スキャン対象の設定 → workspace</a>
      <button id="btn-save-settings" style="padding: 4px 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border); cursor: pointer; border-radius: 4px;">Save Settings</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="status">1:Status</div>
  <div class="tab" data-tab="branches">2:Branches</div>
  <div class="tab" data-tab="commits">3:Commits</div>
  <div class="tab" data-tab="stash">4:Stash</div>
  <div class="tab" data-tab="worktrees">5:Worktrees</div>
</div>

<div class="main-content" id="main-content">
  <div class="left-pane" id="left-pane">
    <div id="tab-content"></div>
    <div class="resizer-x" id="resizer-x"></div>
  </div>
  <div class="right-pane" id="right-pane">
  </div>
</div>

<div class="log-panel" id="log-panel" style="display: none;">
  <div class="resizer-y" id="resizer-y"></div>
  <div id="log-content"></div>
</div>

<div class="footer" id="footer">
  <!-- Keybindings hints -->
</div>

<script src="/tools/git/core.js"></script>
<script src="/tools/git/git-data.js"></script>
<script src="/tools/git/repo-switcher.js"></script>
<script src="/tools/git/settings.js"></script>
<script src="/tools/git/keyboard.js"></script>
<script src="/tools/git/repo-add.js"></script>
<script src="/tools/git/polling.js"></script>
<script src="/tools/git/branches.js"></script>
<script src="/tools/git/worktree.js"></script>
<script src="/tools/git/worktree-cleanup.js"></script>
<script src="/tools/git/init.js"></script>
</body>
</html>
