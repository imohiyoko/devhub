<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ports — devhub</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0d1117;
  --surface: #161b22;
  --border:  #30363d;
  --text:    #e6edf3;
  --muted:   #7d8590;
  --accent:  #388bfd;
  --green:   #3fb950;
  --red:     #f85149;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  flex-shrink: 0;
}
.hub-link {
  font-size: 11px;
  color: var(--muted);
  text-decoration: none;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 5px;
}
.hub-link:hover { color: var(--text); background: var(--border); }
.divider { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }
header h1 { font-size: 15px; font-weight: 600; }
.spacer { flex: 1; }
.search {
  width: 240px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: "SF Mono", ui-monospace, monospace;
  font-size: 12px;
  padding: 6px 9px;
  outline: none;
}
.search:focus { border-color: var(--accent); }
.search::placeholder { color: var(--muted); }
.status {
  color: var(--muted);
  font-size: 11px;
  font-family: "SF Mono", ui-monospace, monospace;
  min-width: 120px;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.status.ok { color: var(--green); }
.status.error { color: var(--red); }

.btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  padding: 6px 11px;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.btn:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.danger:hover:not(:disabled) { background: var(--red); color: #fff; }
.btn:disabled { opacity: 0.45; cursor: default; }

main {
  flex: 1;
  overflow: auto;
  padding: 16px;
}
.ports-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg);
  font-size: 13px;
  white-space: nowrap;
}
.ports-table th, .ports-table td {
  border: 1px solid var(--border);
  padding: 8px 10px;
  text-align: left;
}
.ports-table thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--surface);
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.7px;
  text-transform: uppercase;
}
.ports-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
.ports-table tbody tr:hover { background: rgba(56,139,253,0.08); }
.mono { font-family: "SF Mono", ui-monospace, monospace; }
.port-cell { color: var(--accent); font-weight: 600; }
.label-input {
  width: 220px;
  max-width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-size: 12px;
  padding: 5px 7px;
  outline: none;
}
.label-input:focus { border-color: var(--accent); }
.label-input::placeholder { color: var(--muted); }
.process-cell {
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.self-badge {
  border: 1px solid var(--accent);
  border-radius: 999px;
  color: var(--accent);
  font-size: 10px;
  padding: 1px 6px;
  margin-left: 6px;
}
.empty {
  color: var(--muted);
  font-size: 13px;
  padding: 36px 0;
  text-align: center;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <a href="/" class="hub-link">← Hub</a>
  <div class="divider"></div>
  <h1>ports</h1>
  <div class="spacer"></div>
  <input class="search" id="search" type="text" autocomplete="off" placeholder="port / label / process">
  <button class="btn" id="refreshBtn">再読込</button>
  <div class="status" id="status"></div>
</header>

<main id="main">
  <div class="empty">読み込み中...</div>
</main>

<script>
let ports = [];

const main = document.getElementById('main');
const statusEl = document.getElementById('status');
const searchEl = document.getElementById('search');

function setStatus(text, type = '') {
  statusEl.textContent = text;
  statusEl.className = `status ${type}`.trim();
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function apiJson(url, options = {}) {
  const res = await fetch(url, options);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'request failed');
  return data;
}

async function postJson(url, body) {
  return apiJson(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
}

async function loadPorts() {
  setStatus('読込中...');
  try {
    const data = await apiJson('/api/ports');
    ports = data.ports || [];
    render();
    setStatus(`${ports.length} ports`, 'ok');
  } catch (err) {
    main.innerHTML = '<div class="empty">ポートの取得に失敗しました</div>';
    setStatus(err.message, 'error');
  }
}

function matches(item, query) {
  if (!query) return true;
  const target = [
    item.port,
    item.label,
    item.command,
    item.pid,
    item.user,
    item.host,
  ].join(' ').toLowerCase();
  return target.includes(query);
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  const visible = ports.filter(p => matches(p, q));
  if (!visible.length) {
    main.innerHTML = '<div class="empty">一致するポートがありません</div>';
    return;
  }

  main.innerHTML = `
    <table class="ports-table">
      <thead>
        <tr>
          <th>Port</th>
          <th>Label</th>
          <th>Address</th>
          <th>Process</th>
          <th>PID</th>
          <th>User</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${visible.map(rowHtml).join('')}
      </tbody>
    </table>`;
}

function rowHtml(item) {
  return `
    <tr>
      <td class="mono port-cell">${escapeHtml(item.port)}</td>
      <td>
        <input class="label-input" value="${escapeHtml(item.label)}" placeholder="label"
               data-port="${escapeHtml(item.port)}"
               onkeydown="if(event.key==='Enter') this.blur()"
               onblur="saveLabel(this)">
      </td>
      <td class="mono">${escapeHtml(item.host)}:${escapeHtml(item.port)}</td>
      <td class="process-cell" title="${escapeHtml(item.command)}">
        ${escapeHtml(item.command || '-')}
        ${item.self ? '<span class="self-badge">devhub</span>' : ''}
      </td>
      <td class="mono">${escapeHtml(item.pid)}</td>
      <td>${escapeHtml(item.user || '-')}</td>
      <td>
        <button class="btn danger" ${item.self ? 'disabled' : ''}
                onclick="killPort(${escapeHtml(item.port)}, ${escapeHtml(item.pid)})">kill</button>
      </td>
    </tr>`;
}

async function saveLabel(input) {
  const port = Number(input.dataset.port);
  const label = input.value.trim();
  const item = ports.find(p => p.port === port);
  if (item && item.label === label) return;
  try {
    await postJson('/api/ports/label', { port, label });
    if (item) item.label = label;
    setStatus('保存済', 'ok');
  } catch (err) {
    setStatus(err.message, 'error');
  }
}

async function killPort(port, pid) {
  if (!confirm(`port ${port} / pid ${pid} を終了しますか？`)) return;
  setStatus('kill中...');
  try {
    await postJson('/api/ports/kill', { port, pid });
    setStatus('kill済', 'ok');
    setTimeout(loadPorts, 500);
  } catch (err) {
    setStatus(err.message, 'error');
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadPorts);
searchEl.addEventListener('input', render);
searchEl.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    searchEl.value = '';
    render();
  }
});

loadPorts();
</script>
</body>
</html>
