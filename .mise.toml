# Dev environment toolchain — single source of truth for local + CI.
# Run `mise install` to provision exactly these versions.
#   go : matches the `go` directive in go.mod and setup in CI.
min_version = "2026.1.0"

[tools]
go = "1.26"

# 開発用タスク（ソースから実行）。配布バイナリを使えない環境向けに、
# いまの worktree のコードを go run / go build で動かす。クロスプラットフォーム。
# 停止・再起動は OS 依存のため scripts/dev.sh（Windows は scripts\dev.ps1）を使う。
#   例: DEVHUB_PORT=9000 mise run dev   # 別ポートで検証インスタンスを起動
[tasks.dev]
description = "Run devhub from source (honors DEVHUB_PORT/DEVHUB_HOME). Worktree-aware."
run = "go run ./cmd/devhub"

# Windows で実行ファイル名を .exe にしたい場合は scripts\dev.ps1 build を使う
# （こちらは ./devhub を出力。両方とも .gitignore 済み）。
[tasks.build]
description = "Build the devhub binary into ./devhub"
run = "go build -o devhub ./cmd/devhub"

# CI と同じゲート（gofmt クリーン / vet / test）をローカルで踏むためのタスク。
# mise はクロスプラットフォームなので、make + Git Bash がない Windows でも
# PowerShell だけで CI 相当の判定を得られる。
[tasks.test]
description = "Run the Go test suite (go test ./...)"
run = "go test ./..."

[tasks.vet]
description = "Run go vet ./..."
run = "go vet ./..."

[tasks.fmt]
description = "Format all Go sources in place (gofmt -w .)"
run = "gofmt -w ."

# fmt-check は「差分があれば非ゼロ終了」だが、その判定を sh/cmd どちらでも
# 同じにするため Go ヘルパ（scripts/fmtcheck）に寄せている。CI の gofmt ゲートと同判定。
[tasks.fmt-check]
description = "Fail if any Go source is not gofmt-clean (CI format gate)"
run = "go run ./scripts/fmtcheck"

# push 前のワンショット。CI の Go ジョブ（fmt / vet / build / test）を丸ごと再現する。
# 各ステップは順に実行され、最初の失敗で停止する。
[tasks.check]
description = "Run the full CI gate locally: fmt-check, vet, build, test"
run = [
  "go run ./scripts/fmtcheck",
  "go vet ./...",
  "go build ./...",
  "go test ./...",
]
