<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>devhub</title>
<script src="/shared/reorder.js"></script>
<script src="/shared/rebuild-reload.js"></script>
<link rel="stylesheet" href="/shared/theme.css">
<style>

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 8px;
  flex-shrink: 0;
}
header h1 { font-size: 15px; font-weight: 600; }
.host-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--border);
  color: var(--muted);
  font-family: "SF Mono", ui-monospace, monospace;
}
.header-spacer { flex: 1; }
.header-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, border-color 0.15s;
  flex-shrink: 0;
}
.header-btn:hover, .header-btn.active { color: var(--text); border-color: var(--accent); }

/* ── Restart split button ── */
.restart-wrap { position: relative; display: flex; }
.restart-split {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.restart-split:hover, .restart-split.active { border-color: var(--accent); }
.restart-main-btn {
  background: none;
  border: none;
  border-right: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  font-size: 15px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, background 0.15s;
  font-family: inherit;
}
.restart-main-btn:hover:not(:disabled) { color: var(--text); background: #ffffff0a; }
.restart-main-btn:disabled { opacity: 0.5; cursor: default; }
.restart-arrow-btn {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 10px;
  width: 20px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, background 0.15s;
}
.restart-arrow-btn:hover { color: var(--text); background: #ffffff0a; }
.restart-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px;
  min-width: 220px;
  display: none;
  z-index: 100;
  box-shadow: 0 8px 24px #0006;
}
.restart-menu.open { display: block; }
.restart-menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  background: none;
  border: none;
  border-radius: 5px;
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  padding: 8px 10px;
  text-align: left;
  transition: background 0.12s;
  font-family: inherit;
}
.restart-menu-item:hover { background: #ffffff10; }
.mi-icon { font-size: 15px; line-height: 1; }

/* ── Settings panel ── */
.settings-panel {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 20px 24px;
  display: none;
}
.settings-panel.open { display: block; }
.settings-panel-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin-bottom: 16px;
}
.terminal-settings { max-width: 400px; margin-top: 22px; }
.terminal-settings .settings-panel-title { margin-bottom: 12px; }
.ts-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.ts-row > label { width: 92px; flex-shrink: 0; font-size: 12px; color: var(--muted); }
.ts-row > input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: "SF Mono", ui-monospace, monospace;
  font-size: 12px;
  padding: 5px 8px;
  outline: none;
}
.ts-row > input:focus { border-color: var(--accent); }
.ts-actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.ts-save {
  font-size: 12px;
  padding: 5px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: none;
  color: var(--muted);
  cursor: pointer;
}
.ts-save:hover { border-color: var(--accent); color: var(--accent); }
.ts-hint { font-size: 11px; color: var(--muted); }
.ts-saved { font-size: 11px; color: var(--green); opacity: 0; transition: opacity 0.15s; }
.ts-saved.show { opacity: 1; }
.tool-toggles {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 400px;
}
.toggle-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 4px;
  border-radius: 6px;
  transition: background 0.12s;
}
.toggle-row.insert-before {
  box-shadow: 0 -2px 0 0 var(--accent);
}
.drag-handle {
  color: var(--border);
  cursor: grab;
  font-size: 14px;
  line-height: 1;
  flex-shrink: 0;
  padding: 0 2px;
  user-select: none;
  transition: color 0.12s;
}
.drag-handle:hover { color: var(--muted); }
.toggle-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  flex: 1;
}
.toggle-label-icon { font-size: 16px; line-height: 1; }

/* ── Toggle switch ── */
.toggle-switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  background: var(--border);
  cursor: pointer;
  transition: background 0.2s;
}
.toggle-track::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform 0.2s, background 0.2s;
}
.toggle-switch input:checked + .toggle-track { background: var(--accent); }
.toggle-switch input:checked + .toggle-track::after { transform: translateX(16px); background: #fff; }

main {
  flex: 1;
  padding: 40px 24px;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
}

.section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin-bottom: 16px;
}

.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}

.tool-card {
  display: block;
  text-decoration: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  transition: border-color 0.15s, background 0.15s;
  cursor: grab;
}
.tool-card:hover { border-color: var(--accent); background: #161b22ee; }
.tool-card.insert-before {
  box-shadow: -4px 0 0 0 var(--accent);
}
.tool-icon { font-size: 24px; margin-bottom: 12px; line-height: 1; }
.tool-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.tool-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }

.empty-state { color: var(--muted); font-size: 13px; padding: 8px 0; }

footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  font-family: "SF Mono", ui-monospace, monospace;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.footer-sep { opacity: 0.5; }
.footer-edition {
  padding: 1px 7px;
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 10px;
  color: var(--muted);
}
.footer-link {
  color: var(--muted);
  text-decoration: none;
  transition: color 0.15s;
}
.footer-link:hover { color: var(--accent); }
.footer-spacer { flex: 1; }
.footer-version { cursor: pointer; }
.footer-version:hover { color: var(--text); }
.footer-update {
  border: 1px solid var(--accent);
  color: var(--accent);
  background: transparent;
  border-radius: 9px;
  padding: 1px 8px;
  font: inherit;
  font-size: 10px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.footer-update:hover { background: var(--accent); color: #fff; }

/* ── Update modal ── */
.update-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0, 0, 0, 0.5);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.update-overlay[hidden] { display: none; }
.update-modal {
  background: #161b22;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  width: min(440px, 100%);
  color: var(--text);
  font-size: 13px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
}
.update-modal h2 { font-size: 15px; margin: 0 0 14px; }
.update-ver {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-family: "SF Mono", ui-monospace, monospace;
  color: var(--muted); margin-bottom: 16px;
}
.update-ver strong { color: var(--text); }
.update-ver .arrow { color: var(--accent); }
.update-note { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0 0 12px; }
.update-cmd {
  display: flex; gap: 8px; align-items: center;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; margin-bottom: 4px;
  font-family: "SF Mono", ui-monospace, monospace; font-size: 12px;
}
.update-cmd code { flex: 1; color: var(--text); overflow-x: auto; white-space: nowrap; }
.update-opt {
  display: flex; align-items: center; gap: 6px;
  color: var(--muted); font-size: 11px; margin-top: 16px;
}
.update-actions { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
.update-spacer { flex: 1; }
.update-btn {
  border: 1px solid var(--border); background: transparent; color: var(--text);
  border-radius: 8px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer;
}
.update-btn:hover { border-color: var(--accent); }
.update-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.update-btn.primary:disabled { opacity: 0.6; cursor: default; }

/* ── Approval Panel ── */
.migration-warning {
  background: rgba(22, 27, 34, 0.85);
  border: 1px solid rgba(248, 81, 73, 0.5);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 24px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}
.migration-warning-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--red);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.migration-warning-list {
  margin: 0;
  padding-left: 18px;
  font-size: 13px;
  color: var(--text);
  font-family: "SF Mono", ui-monospace, monospace;
}
.migration-warning-list li { margin: 4px 0; word-break: break-all; }
.migration-warning-hint { font-size: 12px; color: var(--muted); margin-top: 10px; }

.approval-panel {
  background: rgba(22, 27, 34, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(240, 140, 0, 0.4);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 24px;
  display: none;
  animation: slideDown 0.3s ease-out;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}
.approval-panel.open {
  display: block;
}
@keyframes slideDown {
  from { transform: translateY(-20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.approval-title {
  font-size: 14px;
  font-weight: 700;
  color: #ff9e2c;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.approval-detail {
  font-size: 13px;
  color: var(--text);
  margin-bottom: 16px;
  font-family: "SF Mono", ui-monospace, monospace;
  background: rgba(0, 0, 0, 0.3);
  padding: 10px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  word-break: break-all;
}
.approval-actions {
  display: flex;
  gap: 10px;
}
.approval-btn {
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
}
.approval-btn.approve {
  background: var(--green);
  color: #fff;
}
.approval-btn.approve:hover {
  background: #2ea043;
  transform: translateY(-1px);
}
.approval-btn.reject {
  background: #da3633;
  color: #fff;
}
.approval-btn.reject:hover {
  background: #b62320;
  transform: translateY(-1px);
}
.approval-btn.always {
  background: var(--accent);
  color: #fff;
}
.approval-btn.always:hover {
  background: #1f6feb;
  transform: translateY(-1px);
}
</style>
</head>
<body>

<header>
  <h1>devhub</h1>
  <span class="host-badge" id="hostBadge">localhost:8765</span>
  <div class="header-spacer"></div>
  <button class="header-btn" id="settingsBtn" title="設定">⚙</button>
  <div class="restart-wrap" id="restartWrap">
    <div class="restart-split" id="restartSplit">
      <button class="restart-main-btn" id="restartMainBtn" title="リビルド + 再起動">↻</button>
      <button class="restart-arrow-btn" id="restartArrowBtn" title="オプション">▾</button>
    </div>
    <div class="restart-menu" id="restartMenu">
      <button class="restart-menu-item" id="copyMenuItem" onclick="copyCmd()">
        <span class="mi-icon">⎘</span> コマンドをコピー
      </button>
    </div>
  </div>
</header>

<div class="settings-panel" id="settingsPanel">
  <p class="settings-panel-title">ツールの表示設定</p>
  <div class="tool-toggles" id="toolToggles"></div>
  <div class="terminal-settings" id="terminalSettings" hidden>
    <p class="settings-panel-title">ターミナル設定 (<span id="tsOsLabel"></span>)</p>
    <div class="ts-row"><label for="tsEmulator">Emulator</label><input id="tsEmulator" spellcheck="false" autocomplete="off"></div>
    <div class="ts-row"><label for="tsShell">Shell</label><input id="tsShell" spellcheck="false" autocomplete="off"></div>
    <div class="ts-row"><label for="tsShellArgs">Shell args</label><input id="tsShellArgs" spellcheck="false" autocomplete="off" placeholder="スペース区切り (例: --login)"></div>
    <div class="ts-actions">
      <button class="ts-save" id="tsSave">保存</button>
      <span class="ts-hint" id="tsHint"></span>
      <span class="ts-saved" id="tsSaved">保存しました</span>
    </div>
  </div>
</div>

<main>
  <div class="migration-warning" id="migrationWarning" hidden>
    <div class="migration-warning-title">⚠️ ストレージの移行に失敗しました</div>
    <ul class="migration-warning-list" id="migrationWarningList"></ul>
    <div class="migration-warning-hint">devhub は起動していますが、一部の旧データが取り込めていない可能性があります。詳細は起動時のログ（stderr）を確認してください。</div>
  </div>
  <div class="approval-panel" id="approvalPanel">
    <div class="approval-title">⚠️ AI操作の保留中リクエスト</div>
    <div class="approval-detail" id="approvalDetail">-</div>
    <div class="approval-actions">
      <button class="approval-btn approve" id="btnApprove">許可 (Approve)</button>
      <button class="approval-btn reject" id="btnReject">却下 (Reject)</button>
      <button class="approval-btn always" id="btnAlways">常に許可 (Always Allow)</button>
    </div>
  </div>

  <p class="section-title">ツール</p>
  <div class="tools-grid" id="toolsGrid"></div>
</main>

<footer>
  <span>devhub</span>
  <span class="footer-sep">·</span>
  <span class="footer-version" id="footerVersion" title="アップデートを確認">…</span>
  <span class="footer-edition" id="footerEdition" hidden></span>
  <button class="footer-update" id="footerUpdate" hidden></button>
  <span class="footer-spacer"></span>
  <a class="footer-link" href="https://github.com/imohiyoko/devhub" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
</footer>

<div class="update-overlay" id="updateOverlay" hidden>
  <div class="update-modal" role="dialog" aria-modal="true" aria-labelledby="updateTitle">
    <h2 id="updateTitle">アップデート</h2>
    <div class="update-ver">
      <span id="updateCurrent">—</span>
      <span class="arrow" id="updateArrow" hidden>→</span>
      <strong id="updateLatest" hidden></strong>
    </div>
    <div id="updateBody"></div>
    <label class="update-opt" id="updateOpt" hidden>
      <input type="checkbox" id="updateCheckOpt"> 起動時に更新を確認する
    </label>
    <div class="update-actions">
      <span class="update-spacer"></span>
      <button class="update-btn" id="updateClose">閉じる</button>
      <button class="update-btn primary" id="updateApply" hidden>今すぐ更新</button>
    </div>
  </div>
</div>

<script>
// Tool cards are sourced from GET /api/tools (registry-driven), so adding a
// backend tool surfaces here automatically — no edit to this file. The API
// returns {id, title, desc, icon}; the card href is /<id>.
let TOOLS = [];

let disabledTools = [];
let toolOrder = [];
let terminalConfig = {};   // settings.terminal: { <OS>: { emulator, shell, shell_args } }
let currentOS = '';        // /api/info.system: "Windows" | "Darwin" | "Linux"
let restartCmdText = 'devhub';

// Show the address this page was actually reached at (host:port) rather than a
// hardcoded default — it follows a DEVHUB_PORT override or a reclaimed port for
// free, and stays correct without querying the API. Set synchronously to avoid
// flashing the placeholder baked into the markup.
document.getElementById('hostBadge').textContent = location.host;

function orderedTools() {
  if (!toolOrder.length) return TOOLS;
  const map = new Map(TOOLS.map(t => [t.id, t]));
  const result = toolOrder.map(id => map.get(id)).filter(Boolean);
  const inOrder = new Set(toolOrder);
  TOOLS.forEach(t => { if (!inOrder.has(t.id)) result.push(t); });
  return result;
}

function renderGrid() {
  const grid = document.getElementById('toolsGrid');
  const enabled = orderedTools().filter(t => !disabledTools.includes(t.id));
  if (enabled.length === 0) {
    grid.innerHTML = '<p class="empty-state">有効なツールがありません。設定からツールを有効化してください。</p>';
    return;
  }
  grid.innerHTML = enabled.map(t => `
    <a href="${t.href}" class="tool-card" data-id="${t.id}">
      <div class="tool-icon">${t.icon}</div>
      <div class="tool-name">${t.name}</div>
      <div class="tool-desc">${t.desc}</div>
    </a>
  `).join('');
  DevhubReorder.attach(grid, { itemSelector: '.tool-card', keyAttr: 'data-id', onDrop: reorderTools });
}

function renderToggles() {
  const container = document.getElementById('toolToggles');
  container.innerHTML = orderedTools().map(t => `
    <div class="toggle-row" data-id="${t.id}">
      <span class="drag-handle" title="ドラッグで並び替え">⠿</span>
      <span class="toggle-label">
        <span class="toggle-label-icon">${t.icon}</span>
        <span>${t.name}</span>
      </span>
      <label class="toggle-switch">
        <input type="checkbox" data-id="${t.id}" ${disabledTools.includes(t.id) ? '' : 'checked'}
               onchange="onToggle(this)">
        <span class="toggle-track"></span>
      </label>
    </div>
  `).join('');
  DevhubReorder.attach(container, {
    itemSelector: '.toggle-row', keyAttr: 'data-id',
    handleSelector: '.drag-handle', onDrop: reorderTools,
  });
}

/* ── Reorder (grid cards & settings toggles share this) ──
   Drag mechanics live in /shared/reorder.js; here we just translate a
   (src,dst) drop into a new toolOrder and re-render + persist. */
function reorderTools(srcId, dstId) {
  toolOrder = DevhubReorder.move(orderedTools().map(t => t.id), srcId, dstId);
  renderGrid();
  renderToggles();
  saveSettings();
}

/* ── Toggle ── */
async function onToggle(checkbox) {
  const id = checkbox.dataset.id;
  if (checkbox.checked) {
    disabledTools = disabledTools.filter(x => x !== id);
  } else {
    if (!disabledTools.includes(id)) disabledTools.push(id);
  }
  renderGrid();
  saveSettings();
}

async function saveSettings() {
  await fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ disabled_tools: disabledTools, tool_order: toolOrder }),
  });
}

/* ── Terminal settings ──
   env-launcher launches processes in a terminal chosen by settings.terminal for
   the running OS. This edits that per-OS block (emulator / shell / shell_args) so
   it no longer needs a hand-edited settings document — the fix for the Windows
   "wt + powershell" launch also lives here as a workaround (switch shell to cmd,
   or clear the emulator). */
const TERMINAL_HINTS = {
  Windows: 'emulator: wt か空欄 / shell: powershell・pwsh・cmd',
  Darwin: 'emulator: ghostty・Terminal.app・iTerm / shell: zsh・bash',
  Linux: 'emulator: gnome-terminal・xterm / shell: bash・zsh',
};
function renderTerminalSettings() {
  const wrap = document.getElementById('terminalSettings');
  if (!currentOS) { wrap.hidden = true; return; }
  wrap.hidden = false;
  const cfg = terminalConfig[currentOS] || {};
  document.getElementById('tsOsLabel').textContent = currentOS;
  document.getElementById('tsEmulator').value = cfg.emulator || '';
  document.getElementById('tsShell').value = cfg.shell || '';
  document.getElementById('tsShellArgs').value = (cfg.shell_args || []).join(' ');
  document.getElementById('tsHint').textContent = TERMINAL_HINTS[currentOS] || '';
}
async function saveTerminalSettings() {
  const args = document.getElementById('tsShellArgs').value.trim().split(/\s+/).filter(Boolean);
  // POST /api/settings replaces the `terminal` key wholesale, so send the whole
  // object with just the current OS patched — the other OSes must ride along.
  const terminal = {
    ...terminalConfig,
    [currentOS]: {
      emulator: document.getElementById('tsEmulator').value.trim(),
      shell: document.getElementById('tsShell').value.trim(),
      shell_args: args,
    },
  };
  const res = await fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ terminal }),
  });
  if (!res.ok) return;
  terminalConfig = terminal;
  const saved = document.getElementById('tsSaved');
  saved.classList.add('show');
  setTimeout(() => saved.classList.remove('show'), 1500);
}
document.getElementById('tsSave').addEventListener('click', saveTerminalSettings);

/* ── Settings panel toggle ── */
document.getElementById('settingsBtn').addEventListener('click', () => {
  const panel = document.getElementById('settingsPanel');
  const btn = document.getElementById('settingsBtn');
  const open = panel.classList.toggle('open');

/* ── Restart dropdown ── */
document.getElementById('restartMainBtn').addEventListener('click', () => doRebuild());

document.getElementById('restartArrowBtn').addEventListener('click', e => {
  e.stopPropagation();
  const open = document.getElementById('restartMenu').classList.toggle('open');

});

document.addEventListener('click', e => {

function closeMenu() {

  document.getElementById('restartSplit').classList.remove('active');
}

async function doRebuild() {
  closeMenu();
  const btn = document.getElementById('restartMainBtn');
  btn.disabled = true;
  btn.textContent = '⚒';

  const resetBtn = (after = 3000) => {
    btn.textContent = '✗';
    btn.disabled = false;
    setTimeout(() => { btn.textContent = '↻'; }, after);
  };

  // Capture the current process's instance id BEFORE triggering the rebuild.
  // Restart detection compares against this: when /api/info reports a different
  // instance, we know the replacement process is up. This is immune to the race
  // that froze the UI before — a fast `go run` restart whose brief down-window
  // fell between status polls, after which the fresh process kept reporting
  // done:false forever.
  let origInstance = null;
  try {
    const info = await fetch('/api/info').then(r => r.json());
    origInstance = info.instance ?? null;
  } catch { /* best-effort; the null-baseline case is handled in the poll below */ }

  // Start the rebuild; surface HTTP-level errors (e.g. 409 already-running).
  try {
    const res = await fetch('/api/rebuild', { method: 'POST' });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      alert(e.error || `リビルド開始に失敗しました (${res.status})`);
      resetBtn();
      return;
    }
  } catch (e) {
    alert(e?.message || 'リビルド開始に失敗しました');
    resetBtn();
    return;
  }

  // Poll for one of two terminal outcomes, whichever comes first:
  //   success → /api/info reports a new instance id (the replacement is up)
  //   failure → /api/rebuild/status reports done with an error (build failed,
  //             old process stays alive so the instance never changes)
  // Network errors are expected while the server is transitioning and are
  // ignored. A hard deadline guarantees the button can never freeze forever.
  const startedAt = Date.now();
  const DEADLINE_MS = 120000;
  const poll = setInterval(async () => {
    if (Date.now() - startedAt > DEADLINE_MS) {
      clearInterval(poll);
      alert('再起動の確認がタイムアウトしました。手動でリロードしてください。');
      resetBtn();
      return;
    }

    // Build failure: the rebuild never restarts, so catch it via status.
    try {
      const s = await fetch('/api/rebuild/status').then(r => r.ok ? r.json() : null);
      if (s && s.done && s.error) {
        clearInterval(poll);
        alert(`ビルド失敗:\n${s.output || s.error}`);
        resetBtn();
        return;
      }
    } catch { /* transitioning — ignore */ }

    // Success: the replacement process advertises a different instance id.
    try {
      const info = await fetch('/api/info').then(r => r.ok ? r.json() : null);
      if (info && info.instance) {
        // Pre-rebuild baseline was missed (the GET above failed — only possible
        // if the server was unreachable at click time). Adopt the first instance
        // we see as the baseline. Correct as long as that first observation is
        // still the OLD process; in the narrow case where the old process has
        // already exited and we first observe the NEW one, the instance never
        // appears to change and we fall through to the deadline timeout below
        // instead of reloading. Practically unreachable: the rebuild POST just
        // succeeded against this same (alive) server.
        if (origInstance === null) {
          origInstance = info.instance;
        } else if (info.instance !== origInstance) {
          clearInterval(poll);
          // Wake every other open devhub tab (storage fires in other tabs only),
          // then reload this one. See /shared/rebuild-reload.js.
          localStorage.setItem('devhub:reloaded', String(Date.now()));
          location.reload();
        }
      }
    } catch { /* transitioning — ignore */ }
  }, 500);
}

async function copyCmd() {
  closeMenu();
  await navigator.clipboard.writeText(restartCmdText);
  const item = document.getElementById('copyMenuItem');
  const orig = item.innerHTML;
  item.innerHTML = '<span class="mi-icon">✓</span> コピー済';
  setTimeout(() => { item.innerHTML = orig; }, 1200);
}

/* ── Init ── */
(async () => {
  try {
    const [toolsRes, settingsRes, infoRes] = await Promise.all([
      fetch('/api/tools'),
      fetch('/api/settings'),
      fetch('/api/info'),
    ]);
    if (!toolsRes.ok) throw new Error('GET /api/tools → ' + toolsRes.status);
    if (!settingsRes.ok) throw new Error('GET /api/settings → ' + settingsRes.status);
    const toolsJson = await toolsRes.json();
    TOOLS = (toolsJson.tools || []).map(t => ({
      id: t.id,
      href: '/' + t.id,
      icon: t.icon || '',
      name: t.title || t.id,
      desc: t.desc || '',
    }));
    const settings = await settingsRes.json();
    disabledTools = settings.disabled_tools || [];
    toolOrder = settings.tool_order || [];
    terminalConfig = settings.terminal || {};
    if (infoRes.ok) currentOS = ((await infoRes.json()).system) || '';
  } catch (e) {
    console.error('dashboard init failed:', e);
  }
  renderGrid();
  renderToggles();
  renderTerminalSettings();
  renderFooter();
  checkUpdate();
  checkPendingApprovals();
  renderMigrationWarnings();
})();

// Surface best-effort storage migration failures (see storage.MigrationWarnings):
// /api/info returns them so the GUI can flag data that stderr-only logging hid.
async function renderMigrationWarnings() {
  try {
    const info = await fetch('/api/info').then(r => r.ok ? r.json() : null);
    const warnings = info && info.migration_warnings;
    if (!Array.isArray(warnings) || warnings.length === 0) return;
    const list = document.getElementById('migrationWarningList');
    list.innerHTML = '';
    for (const w of warnings) {
      const li = document.createElement('li');
      li.textContent = w; // textContent: never interpolate a message as HTML
      list.appendChild(li);
    }
    document.getElementById('migrationWarning').hidden = false;
  } catch (e) {
    console.error('migration warnings check failed:', e);
  }
}

/* ── Footer ── */
// How each backend edition id (see platform.Edition) is labelled in the footer.
const EDITION_LABELS = { code: 'code', homebrew: 'Homebrew', installer: 'installer' };

async function renderFooter() {
  const vEl = document.getElementById('footerVersion');
  const eEl = document.getElementById('footerEdition');
  try {
    const info = await fetch('/api/info').then(r => r.ok ? r.json() : null);
    const v = info && info.version;
    // A distributed build stamps a real version; a local `go run` reports "dev".
    vEl.textContent = v ? (v === 'dev' ? 'dev' : 'v' + v.replace(/^v/, '')) : '—';
    const ed = info && info.edition;
    if (ed) {
      eEl.textContent = (EDITION_LABELS[ed] || ed) + ' edition';
      eEl.hidden = false;
    }
  } catch {
    vEl.textContent = '—';
  }
}

/* ── Update ── */
let updateStatus = null;

// Format a backend version ("1.2.3" / "v1.2.3" / "dev") for display.
function fmtVer(v) {
  if (!v) return '—';
  v = String(v);
  return v === 'dev' ? 'dev' : 'v' + v.replace(/^v/, '');
}

// Query the backend for update availability and reflect it in the footer badge.
// Silent on failure (offline): the badge simply stays hidden.
async function checkUpdate() {
  const badge = document.getElementById('footerUpdate');
  try {
    updateStatus = await fetch('/api/update/status').then(r => r.ok ? r.json() : null);
  } catch { updateStatus = null; }
  if (updateStatus && updateStatus.update_available) {
    badge.textContent = '⬆ 更新 ' + fmtVer(updateStatus.latest);
    badge.hidden = false;
  } else {
    badge.hidden = true;
  }
}

async function openUpdateModal() {
  // Refresh so the modal reflects current state even when opened long after load.
  if (!updateStatus) { try { await checkUpdate(); } catch { /* offline */ } }
  renderUpdateModal(updateStatus || {});
  document.getElementById('updateOverlay').hidden = false;
}
function closeUpdateModal() { document.getElementById('updateOverlay').hidden = true; }

// Render the modal for every state: dev/source build, checks disabled, offline,
// update-available (installer → one-click; homebrew → command), or up-to-date.
function renderUpdateModal(st) {
  const arrowEl = document.getElementById('updateArrow');
  const latestEl = document.getElementById('updateLatest');
  const body = document.getElementById('updateBody');
  const opt = document.getElementById('updateOpt');
  const applyBtn = document.getElementById('updateApply');

  document.getElementById('updateCurrent').textContent = fmtVer(st.current);
  arrowEl.hidden = true;
  latestEl.hidden = true; latestEl.textContent = '';
  applyBtn.hidden = true; applyBtn.disabled = false; applyBtn.textContent = '今すぐ更新';
  opt.hidden = false;
  document.getElementById('updateCheckOpt').checked = !st.disabled;

  if (st.edition === 'code' || st.current === 'dev' || !st.current) {
    body.innerHTML = '<p class="update-note">ソースから起動しているため更新は不要です（開発ビルド）。</p>';
    opt.hidden = true;
  } else if (st.disabled) {
    body.innerHTML = '<p class="update-note">更新の確認はオフになっています。</p>';
  } else if (st.error) {
    body.innerHTML = '<p class="update-note">更新の確認に失敗しました（オフラインの可能性があります）。</p>';
  } else if (st.update_available) {
    arrowEl.hidden = false;
    latestEl.hidden = false; latestEl.textContent = fmtVer(st.latest);
    if (st.can_self_update) {
      body.innerHTML = '<p class="update-note">新しいバージョンをダウンロードし、checksums.txt（SHA256）で検証してから入れ替え、自動で再起動します。</p>';
      applyBtn.hidden = false;
    } else if (st.upgrade_hint) {
      body.innerHTML = '<p class="update-note">次のコマンドで更新できます。</p>'
        + '<div class="update-cmd"><code id="updateCmdText"></code>'
        + '<button class="update-btn" id="updateCopyCmd">コピー</button></div>';
      document.getElementById('updateCmdText').textContent = st.upgrade_hint;
      document.getElementById('updateCopyCmd').onclick = async () => {
        try { await navigator.clipboard.writeText(st.upgrade_hint); } catch { /* ignore */ }
        const b = document.getElementById('updateCopyCmd');
        b.textContent = 'コピー済'; setTimeout(() => { b.textContent = 'コピー'; }, 1200);
      };
    }
  } else {
    body.innerHTML = '<p class="update-note">最新バージョンです。</p>';
  }
}

async function toggleUpdateCheck(e) {
  const enabled = e.target.checked;
  try {
    await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ update_check: enabled }),
    });
  } catch { /* best effort */ }
  // Re-check so enabling shows the badge immediately when an update exists.
  await checkUpdate();
  renderUpdateModal(updateStatus || {});
}

// Trigger the server-side download+verify+swap, then restart. Reuses the
// rebuild flow's instance-id polling to detect the replacement process.
async function doSelfUpdate() {
  const btn = document.getElementById('updateApply');
  btn.disabled = true; btn.textContent = 'ダウンロード中…';
  const reset = () => { btn.disabled = false; btn.textContent = '今すぐ更新'; };

  let origInstance = null;
  try { origInstance = (await fetch('/api/info').then(r => r.json())).instance ?? null; } catch { /* ignore */ }

  let res;
  try {
    res = await fetch('/api/update/apply', { method: 'POST' });
  } catch { alert('更新の開始に失敗しました。'); reset(); return; }
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    alert(e.error || `更新に失敗しました (${res.status})`);
    reset(); return;
  }

  // The server verified + swapped the binary and is re-execing; wait for the
  // replacement to advertise a new instance id, then reload.
  btn.textContent = '再起動待ち…';
  const startedAt = Date.now();
  const DEADLINE_MS = 120000;
  const poll = setInterval(async () => {
    if (Date.now() - startedAt > DEADLINE_MS) {
      clearInterval(poll);
      alert('再起動の確認がタイムアウトしました。手動でリロードしてください。');
      reset(); return;
    }
    try {
      const info = await fetch('/api/info').then(r => r.ok ? r.json() : null);
      if (info && info.instance) {
        if (origInstance === null) origInstance = info.instance;
        else if (info.instance !== origInstance) {
          clearInterval(poll);
          localStorage.setItem('devhub:reloaded', String(Date.now()));
          location.reload();
        }
      }
    } catch { /* restarting — ignore */ }
  }, 500);
}

document.getElementById('footerUpdate').addEventListener('click', openUpdateModal);
document.getElementById('footerVersion').addEventListener('click', openUpdateModal);
document.getElementById('updateClose').addEventListener('click', closeUpdateModal);
document.getElementById('updateApply').addEventListener('click', doSelfUpdate);
document.getElementById('updateCheckOpt').addEventListener('change', toggleUpdateCheck);
document.getElementById('updateOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'updateOverlay') closeUpdateModal();
});

/* ── Approval handling ── */
let currentPendingRequest = null;

async function checkPendingApprovals() {
  try {
    const res = await fetch('/api/approval/pending');
    if (!res.ok) return;
    const json = await res.json();
    const requests = json.requests || [];
    if (requests.length > 0) {
      currentPendingRequest = requests[0];
      document.getElementById('approvalDetail').textContent = 
        `${currentPendingRequest.action} -> ${currentPendingRequest.detail}`;
      document.getElementById('approvalPanel').classList.add('open');
    } else {
      currentPendingRequest = null;
      document.getElementById('approvalPanel').classList.remove('open');
    }
  } catch (e) {
    console.error('failed to check pending approvals', e);
  }
}

async function respondApproval(decision) {
  if (!currentPendingRequest) return;
  const url = decision === 'always' ? '/api/approval/always-allow' : '/api/approval/respond';
  const body = decision === 'always' 
    ? { id: currentPendingRequest.id }
    : { id: currentPendingRequest.id, decision };
  
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.ok) {
      checkPendingApprovals();
    }
  } catch (e) {
    console.error('respond failed', e);
  }
}

document.getElementById('btnApprove').addEventListener('click', () => respondApproval('approved'));
document.getElementById('btnReject').addEventListener('click', () => respondApproval('rejected'));
document.getElementById('btnAlways').addEventListener('click', () => respondApproval('always'));

setInterval(checkPendingApprovals, 2000);
</script>
