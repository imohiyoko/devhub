<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>devhub</title>
<script src="/shared/reorder.js"></script>
<script src="/shared/rebuild-reload.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0d1117;
  --surface: #161b22;
  --border:  #30363d;
  --text:    #e6edf3;
  --muted:   #7d8590;
  --accent:  #388bfd;
  --green:   #3fb950;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 8px;
  flex-shrink: 0;
}
header h1 { font-size: 15px; font-weight: 600; }
.host-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--border);
  color: var(--muted);
  font-family: "SF Mono", ui-monospace, monospace;
}
.header-spacer { flex: 1; }
.header-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, border-color 0.15s;
  flex-shrink: 0;
}
.header-btn:hover, .header-btn.active { color: var(--text); border-color: var(--accent); }

/* ── Restart split button ── */
.restart-wrap { position: relative; display: flex; }
.restart-split {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  transition: border-color 0.15s;
}
.restart-split:hover, .restart-split.active { border-color: var(--accent); }
.restart-main-btn {
  background: none;
  border: none;
  border-right: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  font-size: 15px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, background 0.15s;
  font-family: inherit;
}
.restart-main-btn:hover:not(:disabled) { color: var(--text); background: #ffffff0a; }
.restart-main-btn:disabled { opacity: 0.5; cursor: default; }
.restart-arrow-btn {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 10px;
  width: 20px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, background 0.15s;
}
.restart-arrow-btn:hover { color: var(--text); background: #ffffff0a; }
.restart-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px;
  min-width: 220px;
  display: none;
  z-index: 100;
  box-shadow: 0 8px 24px #0006;
}
.restart-menu.open { display: block; }
.restart-menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  background: none;
  border: none;
  border-radius: 5px;
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  padding: 8px 10px;
  text-align: left;
  transition: background 0.12s;
  font-family: inherit;
}
.restart-menu-item:hover { background: #ffffff10; }
.mi-icon { font-size: 15px; line-height: 1; }

/* ── Settings panel ── */
.settings-panel {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 20px 24px;
  display: none;
}
.settings-panel.open { display: block; }
.settings-panel-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin-bottom: 16px;
}
.tool-toggles {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 400px;
}
.toggle-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 4px;
  border-radius: 6px;
  transition: background 0.12s;
}
.toggle-row.insert-before {
  box-shadow: 0 -2px 0 0 var(--accent);
}
.drag-handle {
  color: var(--border);
  cursor: grab;
  font-size: 14px;
  line-height: 1;
  flex-shrink: 0;
  padding: 0 2px;
  user-select: none;
  transition: color 0.12s;
}
.drag-handle:hover { color: var(--muted); }
.toggle-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  flex: 1;
}
.toggle-label-icon { font-size: 16px; line-height: 1; }

/* ── Toggle switch ── */
.toggle-switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  background: var(--border);
  cursor: pointer;
  transition: background 0.2s;
}
.toggle-track::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform 0.2s, background 0.2s;
}
.toggle-switch input:checked + .toggle-track { background: var(--accent); }
.toggle-switch input:checked + .toggle-track::after { transform: translateX(16px); background: #fff; }

main {
  flex: 1;
  padding: 40px 24px;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
}

.section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin-bottom: 16px;
}

.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}

.tool-card {
  display: block;
  text-decoration: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  transition: border-color 0.15s, background 0.15s;
  cursor: grab;
}
.tool-card:hover { border-color: var(--accent); background: #161b22ee; }
.tool-card.insert-before {
  box-shadow: -4px 0 0 0 var(--accent);
}
.tool-icon { font-size: 24px; margin-bottom: 12px; line-height: 1; }
.tool-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.tool-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }

.empty-state { color: var(--muted); font-size: 13px; padding: 8px 0; }

footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  font-family: "SF Mono", ui-monospace, monospace;
}

/* ── Approval Panel ── */
.approval-panel {
  background: rgba(22, 27, 34, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(240, 140, 0, 0.4);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 24px;
  display: none;
  animation: slideDown 0.3s ease-out;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}
.approval-panel.open {
  display: block;
}
@keyframes slideDown {
  from { transform: translateY(-20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.approval-title {
  font-size: 14px;
  font-weight: 700;
  color: #ff9e2c;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.approval-detail {
  font-size: 13px;
  color: var(--text);
  margin-bottom: 16px;
  font-family: "SF Mono", ui-monospace, monospace;
  background: rgba(0, 0, 0, 0.3);
  padding: 10px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  word-break: break-all;
}
.approval-actions {
  display: flex;
  gap: 10px;
}
.approval-btn {
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
}
.approval-btn.approve {
  background: var(--green);
  color: #fff;
}
.approval-btn.approve:hover {
  background: #2ea043;
  transform: translateY(-1px);
}
.approval-btn.reject {
  background: #da3633;
  color: #fff;
}
.approval-btn.reject:hover {
  background: #b62320;
  transform: translateY(-1px);
}
.approval-btn.always {
  background: var(--accent);
  color: #fff;
}
.approval-btn.always:hover {
  background: #1f6feb;
  transform: translateY(-1px);
}
</style>
</head>
<body>

<header>
  <h1>devhub</h1>
  <span class="host-badge">localhost:8765</span>
  <div class="header-spacer"></div>
  <button class="header-btn" id="settingsBtn" title="設定">⚙</button>
  <div class="restart-wrap" id="restartWrap">
    <div class="restart-split" id="restartSplit">
      <button class="restart-main-btn" id="restartMainBtn" title="リビルド + 再起動">↻</button>
      <button class="restart-arrow-btn" id="restartArrowBtn" title="オプション">▾</button>
    </div>
    <div class="restart-menu" id="restartMenu">
      <button class="restart-menu-item" id="copyMenuItem" onclick="copyCmd()">
        <span class="mi-icon">⎘</span> コマンドをコピー
      </button>
    </div>
  </div>
</header>

<div class="settings-panel" id="settingsPanel">
  <p class="settings-panel-title">ツールの表示設定</p>
  <div class="tool-toggles" id="toolToggles"></div>
</div>

<main>
  <div class="approval-panel" id="approvalPanel">
    <div class="approval-title">⚠️ AI操作の保留中リクエスト</div>
    <div class="approval-detail" id="approvalDetail">-</div>
    <div class="approval-actions">
      <button class="approval-btn approve" id="btnApprove">許可 (Approve)</button>
      <button class="approval-btn reject" id="btnReject">却下 (Reject)</button>
      <button class="approval-btn always" id="btnAlways">常に許可 (Always Allow)</button>
    </div>
  </div>

  <p class="section-title">ツール</p>
  <div class="tools-grid" id="toolsGrid"></div>
</main>

<footer>devhub · localhost:8765</footer>

<script>
// Tool cards are sourced from GET /api/tools (registry-driven), so adding a
// backend tool surfaces here automatically — no edit to this file. The API
// returns {id, title, desc, icon}; the card href is /<id>.
let TOOLS = [];

let disabledTools = [];
let toolOrder = [];
let restartCmdText = 'devhub';

function orderedTools() {
  if (!toolOrder.length) return TOOLS;
  const map = new Map(TOOLS.map(t => [t.id, t]));
  const result = toolOrder.map(id => map.get(id)).filter(Boolean);
  const inOrder = new Set(toolOrder);
  TOOLS.forEach(t => { if (!inOrder.has(t.id)) result.push(t); });
  return result;
}

function renderGrid() {
  const grid = document.getElementById('toolsGrid');
  const enabled = orderedTools().filter(t => !disabledTools.includes(t.id));
  if (enabled.length === 0) {
    grid.innerHTML = '<p class="empty-state">有効なツールがありません。設定からツールを有効化してください。</p>';
    return;
  }
  grid.innerHTML = enabled.map(t => `
    <a href="${t.href}" class="tool-card" data-id="${t.id}">
      <div class="tool-icon">${t.icon}</div>
      <div class="tool-name">${t.name}</div>
      <div class="tool-desc">${t.desc}</div>
    </a>
  `).join('');
  DevhubReorder.attach(grid, { itemSelector: '.tool-card', keyAttr: 'data-id', onDrop: reorderTools });
}

function renderToggles() {
  const container = document.getElementById('toolToggles');
  container.innerHTML = orderedTools().map(t => `
    <div class="toggle-row" data-id="${t.id}">
      <span class="drag-handle" title="ドラッグで並び替え">⠿</span>
      <span class="toggle-label">
        <span class="toggle-label-icon">${t.icon}</span>
        <span>${t.name}</span>
      </span>
      <label class="toggle-switch">
        <input type="checkbox" data-id="${t.id}" ${disabledTools.includes(t.id) ? '' : 'checked'}
               onchange="onToggle(this)">
        <span class="toggle-track"></span>
      </label>
    </div>
  `).join('');
  DevhubReorder.attach(container, {
    itemSelector: '.toggle-row', keyAttr: 'data-id',
    handleSelector: '.drag-handle', onDrop: reorderTools,
  });
}

/* ── Reorder (grid cards & settings toggles share this) ──
   Drag mechanics live in /shared/reorder.js; here we just translate a
   (src,dst) drop into a new toolOrder and re-render + persist. */
function reorderTools(srcId, dstId) {
  toolOrder = DevhubReorder.move(orderedTools().map(t => t.id), srcId, dstId);
  renderGrid();
  renderToggles();
  saveSettings();
}

/* ── Toggle ── */
async function onToggle(checkbox) {
  const id = checkbox.dataset.id;
  if (checkbox.checked) {
    disabledTools = disabledTools.filter(x => x !== id);
  } else {
    if (!disabledTools.includes(id)) disabledTools.push(id);
  }
  renderGrid();
  saveSettings();
}

async function saveSettings() {
  await fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ disabled_tools: disabledTools, tool_order: toolOrder }),
  });
}

/* ── Settings panel toggle ── */
document.getElementById('settingsBtn').addEventListener('click', () => {
  const panel = document.getElementById('settingsPanel');
  const btn = document.getElementById('settingsBtn');
  const open = panel.classList.toggle('open');
  btn.classList.toggle('active', open);
});

/* ── Restart dropdown ── */
document.getElementById('restartMainBtn').addEventListener('click', () => doRebuild());

document.getElementById('restartArrowBtn').addEventListener('click', e => {
  e.stopPropagation();
  const open = document.getElementById('restartMenu').classList.toggle('open');
  document.getElementById('restartSplit').classList.toggle('active', open);
});

document.addEventListener('click', e => {
  if (!document.getElementById('restartWrap').contains(e.target)) {
    document.getElementById('restartMenu').classList.remove('open');
    document.getElementById('restartSplit').classList.remove('active');
  }
});

function closeMenu() {
  document.getElementById('restartMenu').classList.remove('open');
  document.getElementById('restartSplit').classList.remove('active');
}

async function doRebuild() {
  closeMenu();
  const btn = document.getElementById('restartMainBtn');
  btn.disabled = true;
  btn.textContent = '⚒';

  const resetBtn = (after = 3000) => {
    btn.textContent = '✗';
    btn.disabled = false;
    setTimeout(() => { btn.textContent = '↻'; }, after);
  };

  // Start the rebuild; surface HTTP-level errors (e.g. 409 already-running).
  try {
    const res = await fetch('/api/rebuild', { method: 'POST' });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      alert(e.error || `リビルド開始に失敗しました (${res.status})`);
      resetBtn();
      return;
    }
  } catch (e) {
    alert(e?.message || 'リビルド開始に失敗しました');
    resetBtn();
    return;
  }

  // Phase 1: poll /api/rebuild/status until the build finishes.
  let statusKnown = false;
  const statusPoll = setInterval(async () => {
    try {
      const statusRes = await fetch('/api/rebuild/status');
      if (!statusRes.ok) throw new TypeError(`status ${statusRes.status}`);
      const s = await statusRes.json();
      if (!s.done) return;
      clearInterval(statusPoll);
      statusKnown = true;
      if (s.error) {
        alert(`ビルド失敗:\n${s.output || s.error}`);
        resetBtn();
        return;
      }
      waitForRestart(); // Phase 2
    } catch (e) {
      if (!statusKnown && e instanceof TypeError) {
        // Server went away (network error) mid-poll → restart in progress.
        clearInterval(statusPoll);
        waitForRestart();
      }
    }
  }, 1000);

  // Phase 2: wait for the old server to go DOWN, then wait for the new one to
  // come UP. Checking only for UP risks reloading against the still-alive old
  // process during the ~300 ms window before os.Exit(0).
  function waitForRestart() {
    let wentDown = false;
    const poll = setInterval(async () => {
      try {
        await fetch('/api/info');
        if (wentDown) {
          clearInterval(poll);
          // Wake every other open devhub tab (storage fires in other tabs only),
          // then reload this one. See /shared/rebuild-reload.js.
          localStorage.setItem('devhub:reloaded', String(Date.now()));
          location.reload();
        }
      } catch { wentDown = true; }
    }, 400);
  }
}

async function copyCmd() {
  closeMenu();
  await navigator.clipboard.writeText(restartCmdText);
  const item = document.getElementById('copyMenuItem');
  const orig = item.innerHTML;
  item.innerHTML = '<span class="mi-icon">✓</span> コピー済';
  setTimeout(() => { item.innerHTML = orig; }, 1200);
}

/* ── Init ── */
(async () => {
  try {
    const [toolsRes, settingsRes] = await Promise.all([
      fetch('/api/tools'),
      fetch('/api/settings'),
    ]);
    if (!toolsRes.ok) throw new Error('GET /api/tools → ' + toolsRes.status);
    if (!settingsRes.ok) throw new Error('GET /api/settings → ' + settingsRes.status);
    const toolsJson = await toolsRes.json();
    TOOLS = (toolsJson.tools || []).map(t => ({
      id: t.id,
      href: '/' + t.id,
      icon: t.icon || '',
      name: t.title || t.id,
      desc: t.desc || '',
    }));
    const settings = await settingsRes.json();
    disabledTools = settings.disabled_tools || [];
    toolOrder = settings.tool_order || [];
  } catch (e) {
    console.error('dashboard init failed:', e);
  }
  renderGrid();
  renderToggles();
  checkPendingApprovals();
})();

/* ── Approval handling ── */
let currentPendingRequest = null;

async function checkPendingApprovals() {
  try {
    const res = await fetch('/api/approval/pending');
    if (!res.ok) return;
    const json = await res.json();
    const requests = json.requests || [];
    if (requests.length > 0) {
      currentPendingRequest = requests[0];
      document.getElementById('approvalDetail').textContent = 
        `${currentPendingRequest.action} -> ${currentPendingRequest.detail}`;
      document.getElementById('approvalPanel').classList.add('open');
    } else {
      currentPendingRequest = null;
      document.getElementById('approvalPanel').classList.remove('open');
    }
  } catch (e) {
    console.error('failed to check pending approvals', e);
  }
}

async function respondApproval(decision) {
  if (!currentPendingRequest) return;
  const url = decision === 'always' ? '/api/approval/always-allow' : '/api/approval/respond';
  const body = decision === 'always' 
    ? { id: currentPendingRequest.id }
    : { id: currentPendingRequest.id, decision };
  
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.ok) {
      checkPendingApprovals();
    }
  } catch (e) {
    console.error('respond failed', e);
  }
}

document.getElementById('btnApprove').addEventListener('click', () => respondApproval('approved'));
document.getElementById('btnReject').addEventListener('click', () => respondApproval('rejected'));
document.getElementById('btnAlways').addEventListener('click', () => respondApproval('always'));

setInterval(checkPendingApprovals, 2000);
</script>
</body>
</html>
