name: pages

# site/ の静的ダウンロードページを GitHub Pages へ公開する。
# 初回は repo Settings → Pages の source が "GitHub Actions" である必要があるが、
# configure-pages の enablement: true で未設定なら自動有効化を試みる。
#
# リリース情報はデプロイ時に認証済みトークン（高レート上限）で取得し releases.json に
# 焼き込む。ページは同一オリジンの静的 JSON を読むため、訪問者側の api.github.com 呼び出し
# が不要になり 60req/h の未認証レート制限（403）を回避できる。release イベントでも再生成する。
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published, edited, deleted, released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1本だけ。実行中があってもキャンセルせず最新を待たせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      # リリース一覧を最小スキーマで焼き込む（draft 除外）。認証済みなのでレート制限に余裕。
      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=30" \
            --jq '[.[] | select(.draft | not) | {tag_name, prerelease, published_at, assets: [.assets[] | {name, browser_download_url}]}]' \
            > site/releases.json
          echo "releases.json: $(jq length site/releases.json) entries"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
