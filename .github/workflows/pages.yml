name: pages

# site/ の静的ダウンロードページを GitHub Pages へ公開する。
# 初回は repo Settings → Pages の source が "GitHub Actions" である必要があるが、
# configure-pages の enablement: true で未設定なら自動有効化を試みる。
#
# リリース情報はデプロイ時に認証済みトークン（高レート上限）で取得し releases.json に
# 焼き込む。ページは同一オリジンの静的 JSON を読むため、訪問者側の api.github.com 呼び出し
# が不要になり 60req/h の未認証レート制限（403）を回避できる。release イベントでも再生成する。
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published, edited, deleted, released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1本だけ。実行中があってもキャンセルせず最新を待たせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 常に main の site/ を配信する。release イベント等でタグの commit を
      # checkout してしまうと古い内容へ巻き戻りうるため ref を固定する。
      # releases.json は下の gh api（GH_TOKEN）で取得するので checkout の
      # 資格情報は残さない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      # リリース一覧を最小スキーマで焼き込む（draft 除外）。認証済みなのでレート制限に余裕。
      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=30" \
            --jq '[.[] | select(.draft | not) | {tag_name, prerelease, published_at, assets: [.assets[] | {name, browser_download_url}]}]' \
            > site/releases.json
          echo "releases.json: $(jq length site/releases.json) entries"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      # upload-pages-artifact@v3 の中身を展開して同梱する。この composite は内部で
      # actions/upload-artifact@v4 を「タグ」参照するため、リポジトリの
      # sha_pinning_required ポリシーに引っかかり弾かれる。tar 生成 + SHA 固定の
      # upload-artifact に分解して、SHA ピン必須を保ったまま Pages 用アーティファクト
      # （github-pages: 単一 gzip tar）を生成する。
      - name: Archive Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
