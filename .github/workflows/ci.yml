name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Keep validating the Python tree until it is removed at v1.0.0.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: "2026.6.11" # pin mise itself for reproducible runs
      - run: python3 -m unittest discover -s tests -v

  go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: "2026.6.11" # pin mise itself for reproducible runs
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
