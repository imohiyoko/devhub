name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Group by PR branch (head_ref) so a new push to the same PR cancels the previous
# in-progress run. That cancelled run is on the SUPERSEDED commit, never the PR head,
# so it does not show up as a red check on the PR. push / workflow_dispatch have no
# head_ref and fall back to github.ref; push-to-main is never cancelled so every merge
# commit is built.
#
# Grouping by head_ref/ref (rather than pull_request.number) also keeps this group
# distinct from the legacy ci.yml's workflow_run group on main during the transition,
# so the old main-context run cannot cancel this PR's run before this change merges.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# mise itself is pinned to this exact version for reproducible CI runs.
# Keep it in sync across all jobs here and in release.yml.
env:
  MISE_VERSION: "2026.6.11"

jobs:
  # Apply path-based labels, then decide which downstream jobs to run.
  #
  # Everything lives in this single pull_request workflow (clusterops-style) so that
  # the Go jobs surface as checks ON THE PR. The previous design ran the labeler in a
  # separate workflow and chained CI via workflow_run, which executed in the main-branch
  # context and never attached to the PR's check suite.
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      run_go: ${{ steps.decide.outputs.run_go }}
    steps:
      # No checkout needed: actions/labeler fetches .github/labeler.yml via the API.
      - name: apply labels
        id: labeler
        # A labeler outage or a labeler.yml gap must NOT skip Go CI on a Go change,
        # so continue past a labeler failure and let the file scan below be the gate.
        continue-on-error: true
        if: github.event_name == 'pull_request'
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Label-independent safety net: inspect the PR's changed files directly and
      # flag Go-relevant ones (**/*.go, go.mod/sum, toolchain/build config). This is
      # the structural source of truth for the gate, so a labeler outage or a
      # labeler.yml gap can no longer let a Go change merge with the build/test
      # matrix silently skipped. Uses the preinstalled gh CLI — no extra action.
      - name: detect Go-relevant file changes
        id: paths
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -qE '\.go$|^go\.(mod|sum)$|^\.mise\.toml$|^Makefile$|^\.github/workflows/ci\.yml$'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      # Run the Go matrix when EITHER the file scan found Go-relevant changes OR the
      # labeler applied a code label (ci/core-* / ci/tool-*, which also covers a
      # frontend-only tool change). ci/docs and ci/site do NOT match, so docs-only /
      # site-only PRs still skip the matrix. push / workflow_dispatch have no PR
      # context and gate the downstream jobs on event_name directly (run_go empty).
      - name: decide whether to run Go CI
        id: decide
        if: github.event_name == 'pull_request'
        run: |
          labels_match=${{ contains(steps.labeler.outputs.all-labels, 'ci/core-') || contains(steps.labeler.outputs.all-labels, 'ci/tool-') }}
          if [ "${{ steps.paths.outputs.go }}" = "true" ] || [ "$labels_match" = "true" ]; then
            echo "run_go=true" >> "$GITHUB_OUTPUT"
          fi

  # Formatting is OS-independent, so it runs once on Linux rather than across the
  # build matrix. Fails if any file is not gofmt-clean.
  fmt:
    needs: label
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.label.outputs.run_go == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: ${{ env.MISE_VERSION }}
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  # Native tests on every OS+arch combination that has a reliable hosted runner.
  # macos-latest = Apple Silicon (arm64). macOS amd64 (Intel / macos-13) has an
  # unreliable runner pool so it is covered by the cross-compile job instead.
  # ubuntu-24.04-arm = Linux arm64 native runner.
  # Windows arm64 has no GitHub-hosted runner, so it is covered by cross-compile only.
  go:
    needs: label
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.label.outputs.run_go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest      # Linux amd64
          - runner: ubuntu-24.04-arm   # Linux arm64
          - runner: macos-latest       # macOS arm64 (Apple Silicon)
          - runner: windows-latest     # Windows amd64
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: ${{ env.MISE_VERSION }}
      # mise-action caches the toolchain, not Go's module/build caches — restore
      # those here. The cross-OS build-cache paths are all listed; cache silently
      # ignores the ones that don't exist on a given runner.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  # Verify that every goreleaser target cross-compiles cleanly from Linux.
  # This catches GOOS/GOARCH-specific build errors that the native matrix above
  # cannot cover (e.g. windows/arm64 has no hosted runner).
  cross:
    needs: label
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.label.outputs.run_go == 'true'
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: cross-go-${{ hashFiles('**/go.sum') }}
          restore-keys: cross-go-
      - name: cross-compile all targets
        run: |
          for GOOS in darwin linux windows; do
            for GOARCH in amd64 arm64; do
              echo "==> $GOOS/$GOARCH"
              GOOS=$GOOS GOARCH=$GOARCH go build ./...
            done
          done

  # Single required status check for the "protect main" ruleset. It runs on every
  # PR (if: always()) so it ALWAYS reports a status, unlike fmt/go/cross which are
  # skipped on docs-only / site-only PRs. A skipped upstream job never materialises
  # its check context (matrix legs like `go (ubuntu-latest)` are only created when
  # the matrix expands), so requiring those contexts directly deadlocks docs PRs at
  # "Expected — Waiting for status to be reported". Requiring only `gate` fixes that:
  # it passes when the upstream jobs succeeded OR were legitimately skipped, and
  # fails if any failed or was cancelled — so real regressions still block merge.
  #
  # Ruleset change that must accompany this (repo Settings → Rules → "protect main"):
  # replace the required checks {fmt, cross, go (…×4)} with just {gate}.
  gate:
    needs: [label, fmt, go, cross]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: verify required jobs are green or skipped
        run: |
          # `label` is included so that a FAILURE of the gating job itself (e.g.
          # the gh-api file scan erroring out) cannot silently skip fmt/go/cross
          # and still turn `gate` green. label runs on every event and is never
          # legitimately skipped, so a failure|cancelled here is always a real
          # problem. fmt/go/cross may be legitimately `skipped` on docs-only PRs,
          # which the loop treats as passing (only failure|cancelled block merge).
          for r in "${{ needs.label.result }}" "${{ needs.fmt.result }}" "${{ needs.go.result }}" "${{ needs.cross.result }}"; do
            case "$r" in
              failure|cancelled)
                echo "::error::a required job did not pass: $r"
                exit 1 ;;
            esac
          done
          echo "all required jobs succeeded or were skipped: label=${{ needs.label.result }} fmt=${{ needs.fmt.result }} go=${{ needs.go.result }} cross=${{ needs.cross.result }}"
