name: ci

on:
  push:
    branches: [main]
  pull_request:

# mise itself is pinned to this exact version for reproducible CI runs.
# Keep it in sync across all jobs here and in release.yml.
env:
  MISE_VERSION: "2026.6.11"

jobs:
  # Formatting is OS-independent, so it runs once on Linux rather than across the
  # build matrix. Fails if any file is not gofmt-clean.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  # Native tests on every OS+arch combination that has a reliable hosted runner.
  # macos-latest = Apple Silicon (arm64). macOS amd64 (Intel / macos-13) has an
  # unreliable runner pool so it is covered by the cross-compile job instead.
  # ubuntu-24.04-arm = Linux arm64 native runner.
  # Windows arm64 has no GitHub-hosted runner, so it is covered by cross-compile only.
  go:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest      # Linux amd64
          - runner: ubuntu-24.04-arm   # Linux arm64
          - runner: macos-latest       # macOS arm64 (Apple Silicon)
          - runner: windows-latest     # Windows amd64
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
      # mise-action caches the toolchain, not Go's module/build caches — restore
      # those here. The cross-OS build-cache paths are all listed; cache silently
      # ignores the ones that don't exist on a given runner.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  # Verify that every goreleaser target cross-compiles cleanly from Linux.
  # This catches GOOS/GOARCH-specific build errors that the native matrix above
  # cannot cover (e.g. windows/arm64 has no hosted runner).
  cross:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: cross-go-${{ hashFiles('**/go.sum') }}
          restore-keys: cross-go-
      - name: cross-compile all targets
        run: |
          for GOOS in darwin linux windows; do
            for GOARCH in amd64 arm64; do
              echo "==> $GOOS/$GOARCH"
              GOOS=$GOOS GOARCH=$GOARCH go build ./...
            done
          done
