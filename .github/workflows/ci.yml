name: ci

on:
  push:
    branches: [main]
  pull_request:

# mise itself is pinned to this exact version for reproducible CI runs.
# Keep it in sync across all jobs here and in release.yml.
env:
  MISE_VERSION: "2026.6.11"

jobs:
  # Keep validating the Python tree until it is removed at v1.0.0.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
      - run: python3 -m unittest discover -s tests -v

  go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
      # mise-action caches the toolchain, not Go's module/build caches — restore
      # those here. The cross-OS build-cache paths are all listed; cache silently
      # ignores the ones that don't exist on a given runner.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
