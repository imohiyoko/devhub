name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Group by PR number (or ref for push/dispatch) so rapid pushes / label changes on
# the same PR cancel the in-progress run instead of queuing a second one. Push-to-main
# runs are never cancelled so every merge commit is built.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# mise itself is pinned to this exact version for reproducible CI runs.
# Keep it in sync across all jobs here and in release.yml.
env:
  MISE_VERSION: "2026.6.11"

jobs:
  # Apply path-based labels, then decide which downstream jobs to run.
  #
  # Everything lives in this single pull_request workflow (clusterops-style) so that
  # the Go jobs surface as checks ON THE PR. The previous design ran the labeler in a
  # separate workflow and chained CI via workflow_run, which executed in the main-branch
  # context and never attached to the PR's check suite.
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      run_go: ${{ steps.decide.outputs.run_go }}
    steps:
      # No checkout needed: actions/labeler fetches .github/labeler.yml via the API.
      - name: apply labels
        id: labeler
        if: github.event_name == 'pull_request'
        uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The Go jobs run when any code label (ci/core-* or ci/tool-*) is present.
      # actions/labeler's `all-labels` output already reflects the labels it just
      # applied, so unlike the clusterops sleep+refetch idiom there is no race and
      # no extra action needed. ci/docs and ci/site intentionally do NOT match, so
      # docs-only / site-only PRs skip the Go build matrix.
      # push / workflow_dispatch have no PR context — those events gate the downstream
      # jobs directly on event_name, leaving run_go empty here.
      - name: decide whether to run Go CI
        id: decide
        if: |
          github.event_name == 'pull_request' &&
          (
            contains(steps.labeler.outputs.all-labels, 'ci/core-') ||
            contains(steps.labeler.outputs.all-labels, 'ci/tool-')
          )
        run: echo "run_go=true" >> "$GITHUB_OUTPUT"

  # Formatting is OS-independent, so it runs once on Linux rather than across the
  # build matrix. Fails if any file is not gofmt-clean.
  fmt:
    needs: label
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.label.outputs.run_go == 'true'
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: ${{ env.MISE_VERSION }}
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  # Native tests on every OS+arch combination that has a reliable hosted runner.
  # macos-latest = Apple Silicon (arm64). macOS amd64 (Intel / macos-13) has an
  # unreliable runner pool so it is covered by the cross-compile job instead.
  # ubuntu-24.04-arm = Linux arm64 native runner.
  # Windows arm64 has no GitHub-hosted runner, so it is covered by cross-compile only.
  go:
    needs: label
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.label.outputs.run_go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest      # Linux amd64
          - runner: ubuntu-24.04-arm   # Linux arm64
          - runner: macos-latest       # macOS arm64 (Apple Silicon)
          - runner: windows-latest     # Windows amd64
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: ${{ env.MISE_VERSION }}
      # mise-action caches the toolchain, not Go's module/build caches — restore
      # those here. The cross-OS build-cache paths are all listed; cache silently
      # ignores the ones that don't exist on a given runner.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  # Verify that every goreleaser target cross-compiles cleanly from Linux.
  # This catches GOOS/GOARCH-specific build errors that the native matrix above
  # cannot cover (e.g. windows/arm64 has no hosted runner).
  cross:
    needs: label
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.label.outputs.run_go == 'true'
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: cross-go-${{ hashFiles('**/go.sum') }}
          restore-keys: cross-go-
      - name: cross-compile all targets
        run: |
          for GOOS in darwin linux windows; do
            for GOARCH in amd64 arm64; do
              echo "==> $GOOS/$GOARCH"
              GOOS=$GOOS GOARCH=$GOARCH go build ./...
            done
          done
