name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_run:
    workflows: ["labeler"]
    types: [completed]
  workflow_dispatch:

# mise itself is pinned to this exact version for reproducible CI runs.
# Keep it in sync across all jobs here and in release.yml.
env:
  MISE_VERSION: "2026.6.11"

jobs:
  # Resolve the PR's current labels regardless of how this workflow was triggered.
  # - workflow_run: fired after the labeler completes; fetches labels and head SHA via API
  # - pull_request/labeled: human-added label; reads from event payload
  # - push/workflow_dispatch: no PR context; outputs empty (other jobs gate on event_name)
  get_labels:
    runs-on: ubuntu-latest
    # Skip if the labeler itself failed — stale labels from a previous run could mislead CI.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      names: ${{ steps.labels.outputs.names }}
      head_sha: ${{ steps.labels.outputs.head_sha }}
    steps:
      - id: labels
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            let names = []
            let headSha = ''
            if (context.eventName === 'workflow_run') {
              const pr = context.payload.workflow_run.pull_requests?.[0]
              if (pr) {
                const { data } = await github.rest.pulls.get({
                  ...context.repo,
                  pull_number: pr.number,
                })
                names = data.labels.map(l => l.name)
                headSha = data.head.sha
              }
            } else if (context.eventName === 'pull_request') {
              names = context.payload.pull_request.labels.map(l => l.name)
              headSha = context.payload.pull_request.head.sha
            }
            core.setOutput('names', names.join(','))
            // Empty string is intentional for push/workflow_dispatch: actions/checkout falls back to GITHUB_SHA.
            core.setOutput('head_sha', headSha)

  # Formatting is OS-independent, so it runs once on Linux rather than across the
  # build matrix. Fails if any file is not gofmt-clean.
  fmt:
    needs: get_labels
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(needs.get_labels.outputs.names, 'ci/core-') ||
      contains(needs.get_labels.outputs.names, 'ci/tool-')
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
          ref: ${{ needs.get_labels.outputs.head_sha }}
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: ${{ env.MISE_VERSION }}
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  # Native tests on every OS+arch combination that has a reliable hosted runner.
  # macos-latest = Apple Silicon (arm64). macOS amd64 (Intel / macos-13) has an
  # unreliable runner pool so it is covered by the cross-compile job instead.
  # ubuntu-24.04-arm = Linux arm64 native runner.
  # Windows arm64 has no GitHub-hosted runner, so it is covered by cross-compile only.
  go:
    needs: get_labels
    runs-on: ${{ matrix.runner }}
    # contains() substring-matches the comma-joined label string; 'ci/core-' and 'ci/tool-'
    # intentionally match all labels under those prefixes without listing each one explicitly.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(needs.get_labels.outputs.names, 'ci/core-') ||
      contains(needs.get_labels.outputs.names, 'ci/tool-')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest      # Linux amd64
          - runner: ubuntu-24.04-arm   # Linux arm64
          - runner: macos-latest       # macOS arm64 (Apple Silicon)
          - runner: windows-latest     # Windows amd64
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
          ref: ${{ needs.get_labels.outputs.head_sha }}
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: ${{ env.MISE_VERSION }}
      # mise-action caches the toolchain, not Go's module/build caches — restore
      # those here. The cross-OS build-cache paths are all listed; cache silently
      # ignores the ones that don't exist on a given runner.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  # Verify that every goreleaser target cross-compiles cleanly from Linux.
  # This catches GOOS/GOARCH-specific build errors that the native matrix above
  # cannot cover (e.g. windows/arm64 has no hosted runner).
  cross:
    needs: get_labels
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(needs.get_labels.outputs.names, 'ci/core-') ||
      contains(needs.get_labels.outputs.names, 'ci/tool-')
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
          ref: ${{ needs.get_labels.outputs.head_sha }}
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: cross-go-${{ hashFiles('**/go.sum') }}
          restore-keys: cross-go-
      - name: cross-compile all targets
        run: |
          for GOOS in darwin linux windows; do
            for GOARCH in amd64 arm64; do
              echo "==> $GOOS/$GOARCH"
              GOOS=$GOOS GOARCH=$GOARCH go build ./...
            done
          done
