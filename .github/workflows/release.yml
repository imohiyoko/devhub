name: release

# Two ways to cut a release:
#   1. workflow_dispatch (Actions タブから手動): bump=patch|minor|major を選ぶと
#      最新の v* タグから次バージョンを計算し、そのコミットを凍結する
#      release/vX.Y.Z ブランチを作成・push してから、同コミットに vX.Y.Z タグを
#      付けて push し、続けて公開する。
#   2. push: tags v* (ローカルから `git push origin vX.Y.Z`): そのタグで公開する
#      （リリースブランチは作らない。上級者向けの直接経路）。
# 手動実行時のタグ push は GITHUB_TOKEN 由来のため push トリガーを再帰起動しない
# （= 二重リリースは起きない）。同一ジョブ内で続けて goreleaser を回す。
#
# リリースは environment: release に紐づくため、その required reviewers が承認する
# まで下のジョブ（ブランチ/タグ作成・公開・tap 鍵の受け渡し）は動かない。これが
# 「リリースできる人」を絞る一次コントロールで、workflow_dispatch でもタグ直 push
# でも承認前には公開されない。release/* と v* は ruleset で保護し（作成/更新/削除/
# force-push を制限）、その ruleset の bypass にこのワークフローの push 主体
# （github-actions[bot]）を含めておくこと。含めないと下の自動 push が弾かれる。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "セマンティックバージョンの上げ幅"
        type: choice
        options: [patch, minor, major]
        default: minor
      prerelease:
        description: "プレリリース識別子（例: rc1。安定版は空欄）"
        type: string
        default: ""

permissions:
  contents: write # タグ作成 + GitHub Release 公開に必要
  id-token: write # cosign keyless 署名の OIDC トークン発行に必要
  actions: write # 公開後に pages.yml を workflow_dispatch で起こすため

# 同時に複数のリリースが走らないようにする（タグの競合・二重公開を防ぐ）。
concurrency:
  group: release
  cancel-in-progress: false

# mise itself is pinned to this exact version for reproducible runs.
# Keep it in sync with the value in ci.yml.
env:
  MISE_VERSION: "2026.6.11"

jobs:
  goreleaser:
    runs-on: ubuntu-latest # CGO_ENABLED=0 cross-compiles all targets from one runner
    # GitHub App の秘密鍵（TAP_APP_ID / TAP_APP_PRIVATE_KEY）はこの Environment に
    # 紐づけて登録する。required reviewers を設定しておくと、リリースを人が承認した
    # ときだけ鍵がジョブに渡るため、汚染コードが勝手に実行されても鍵に触れない。
    # （CI 経路の露出を絞る対策。鍵が CI 以外の経路で漏れた場合は別途、鍵の回転・
    #  tap の branch protection・push 監視で多層防御すること。）
    environment: release
    env:
      # 後段の step の if で「tap 公開の初期設定が済んでいるか」を判定するために
      # App ID を env へ写す（secrets コンテキストは step の if 条件で直接参照できない）。
      TAP_APP_ID: ${{ secrets.TAP_APP_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history for the changelog and tag computation

      # 手動実行時のみ: 次バージョンを採番し、そのコミットを凍結する
      # release/vX.Y.Z ブランチを作成・push してから、同コミットにタグを付けて push する。
      - name: Compute version, create release branch and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          PRE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          # リリースは main からのみ（誤ったブランチでの採番を防ぐ）。
          if [ "${GITHUB_REF#refs/heads/}" != "main" ]; then
            echo "::error::release は main ブランチから実行してください（現在: ${GITHUB_REF}）"
            exit 1
          fi
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          [ -z "$latest" ] && latest="v0.0.0"
          base="${latest#v}"; base="${base%%-*}" # 先頭 v と -pre を除去
          # X.Y.Z をパラメータ展開で分解（heredoc を避けて YAML 字下げの罠を回避）。
          major="${base%%.*}"; rest="${base#*.}"
          minor="${rest%%.*}"; patch="${rest##*.}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::unknown bump: $BUMP"; exit 1 ;;
          esac
          next="v${major}.${minor}.${patch}"
          # プレリリース識別子は semver の許容文字だけに絞る。ここで弾かないと、
          # 例えば `+build` 付きタグが署名付きで公開されるのに、インストーラ/自己更新の
          # cosign 検証 identity（vX.Y.Z(-pre) のみ許可、`+` 不可）が弾いて
          # 「誰も検証できないリリース」になる。タグ規約: vX.Y.Z(-pre)、build metadata 不可。
          if [ -n "$PRE" ]; then
            case "$PRE" in
              *[!0-9A-Za-z.-]*) echo "::error::prerelease は [0-9A-Za-z.-] のみ使用できます（現在: ${PRE}）"; exit 1 ;;
            esac
            next="${next}-${PRE}"
          fi
          branch="release/${next}"
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "::error::tag ${next} は既に存在します"
            exit 1
          fi
          # リリースブランチは 1 バージョン 1 本。既存なら採番か過去実行の取り違え。
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "::error::branch ${branch} は既に存在します"
            exit 1
          fi
          echo "前回: ${latest}  →  今回: ${next}（branch: ${branch}）"
          echo "## release ${next} (from ${latest}, branch ${branch})" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 今の main HEAD を凍結するリリースブランチを作成して push（保護対象）。
          git branch "${branch}"
          git push origin "refs/heads/${branch}:refs/heads/${branch}"
          # 同じコミットにタグを付けて push（goreleaser がこのタグで公開する）。
          git tag -a "${next}" -m "release ${next}"
          git push origin "${next}"

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: ${{ env.MISE_VERSION }}

      # checksums.txt を keyless 署名するための cosign CLI を導入する。
      # 注: installer v3（cosign v2.5 系）へのピンは意図的（issue #109 の移行構成）。
      # .goreleaser.yaml は cosign v2 の --new-bundle-format で sigstore bundle と
      # 従来の .sig/.pem の両形式を添付している。installer v4（cosign v3、
      # sign-blob は --bundle 必須で --output-signature/--output-certificate 廃止）
      # へ上げるのは、.sig/.pem の添付を撤去して .goreleaser.yaml の signs を
      # v3 流へ書き換えるときに合わせて行うこと。
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # 別リポジトリ imohiyoko/homebrew-devhub へ Cask を push するためのトークンを
      # GitHub App から「その実行限り」の短命トークンとして発行する。長期保管する
      # PAT を持たずに済む（秘密として保持するのは App ID と秘密鍵のみ）。
      # App は homebrew-devhub に Contents: write 権限でインストールしておくこと。
      # TAP_APP_ID 未設定（= tap 公開の初期設定が未完了）のときはこのステップを
      # スキップする。コアのリリース（バイナリ + GitHub Release）を tap 公開の
      # 成否に依存させないため、トークン発行の失敗でジョブを落とさない。
      - name: Generate tap token
        id: tap_token
        if: ${{ env.TAP_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          # トークンのスコープを tap リポジトリ 1 つに限定する。
          owner: imohiyoko
          repositories: homebrew-devhub
          # 権限も Contents:write だけに絞る（未指定だと installation の全権限を継承）。
          permission-contents: write

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "v2.16.0" # 固定版で再現性を担保（従来は "~> v2"）
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cask の push 先（別リポジトリ）用。上で発行した短命 App トークンを渡す。
          # GITHUB_TOKEN は同一リポジトリにしか書けないため別途必要。
          # 未発行時は空（このとき GoReleaser 側で skip_upload が true になるためアップロードのみスキップされる）。
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap_token.outputs.token }}

      # ダウンロードページ（GitHub Pages）の releases.json を焼き直す。
      # pages.yml の `release:` トリガーは発火しない — goreleaser のリリース公開は
      # GITHUB_TOKEN 由来のため、GitHub が再帰防止で release イベントを抑止する。
      # そのため公開が終わってからここで pages.yml を明示的に起こす。
      # workflow_dispatch は GITHUB_TOKEN でも抑止されない例外なので発火する。
      - name: Refresh download page (releases.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
