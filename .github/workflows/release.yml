name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the GitHub Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest # CGO_ENABLED=0 cross-compiles all targets from one runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the changelog
      - uses: jdx/mise-action@v2
        with:
          version: "2026.6.11" # pin mise itself for reproducible runs
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
