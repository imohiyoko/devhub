# GoReleaser config: cross-compiles devhub for darwin/linux/windows x amd64/arm64
# (CGO disabled — modernc.org/sqlite is pure Go), archives each, emits a SHA256
# checksums.txt, and publishes a GitHub Release. Validate locally with
#   goreleaser check
#   goreleaser release --snapshot --clean   # builds dist/ without publishing
version: 2
project_name: devhub

before:
  hooks:
    - go mod tidy

builds:
  - id: devhub
    main: ./cmd/devhub
    binary: devhub
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.CommitDate}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    # asset name e.g. devhub_1.0.0_darwin_arm64.tar.gz — the install scripts
    # depend on this exact template.
    name_template: "devhub_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# checksums.txt を cosign の keyless 署名（GitHub Actions OIDC → Fulcio 発行の
# 短命証明書、Rekor 透明性ログに記録）で署名する。同一リリース内の checksums.txt は
# SHA256 でバイナリを縛るが、リリース書き込み権限を奪われるとバイナリと
# checksums.txt を同時に差し替え得る。cosign 署名は「imohiyoko/devhub の release
# ワークフローが発行した」ことを証明し、長期鍵を保持せずにこの経路を塞ぐ。
#
# cosign v3 で sign-blob は bundle 出力（--bundle）が必須になり、.sig/.pem を書く
# --output-signature/--output-certificate は廃止された（issue #109）。移行期間中は
# 2 回署名して両形式をリリースに添付する:
#   1. 従来形式 checksums.txt.sig / .pem — 配布済みバイナリの自己更新と
#      cosign v2 クライアントの検証互換のため（撤去すると既存クライアントの
#      DEVHUB_VERIFY_SIGNATURE=1 が全滅する）
#   2. sigstore bundle checksums.txt.sigstore.json — cosign v3+ クライアントの
#      `verify-blob --bundle` 用。署名側はまだ cosign v2（installer v3 ピン）の
#      ため --new-bundle-format で v3 互換の標準 bundle 形式を出力する
# 数リリース分の移行期間の後に 1 を撤去し、cosign-installer を v4（cosign v3）へ
# 上げる。その際この args も v3 流（--bundle のみ、--new-bundle-format 不要）に
# 書き換えること。
signs:
  - id: legacy-sig-pem
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - "sign-blob"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "--yes"
      - "${artifact}"
    output: true
  - id: sigstore-bundle
    cmd: cosign
    artifacts: checksum
    # goreleaser の signs にはアップロード対象を登録する枠が signature/certificate
    # の 2 つしかないため、bundle は signature 枠で登録する（実体は bundle JSON）。
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--new-bundle-format=true"
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    output: true

# Homebrew Cask（macOS 向け）。ビルド済みバイナリの配布は Homebrew 公式が Cask を
# 推奨しており、goreleaser でも現行のメンテ対象（旧 brews=Formula は非推奨）。
# darwin のアーカイブのみが対象になる（Cask は macOS 専用。Linux は install.sh）。
# 公開先は別リポジトリ imohiyoko/homebrew-devhub。push には別リポジトリへの
# 書き込み権限が要る。release ワークフローが GitHub App から発行した短命トークンを
# HOMEBREW_TAP_GITHUB_TOKEN として渡す（長期保管する PAT を持たない方式）。
# 利用者は `brew install --cask imohiyoko/devhub/devhub` で導入できる。
homebrew_casks:
  - name: devhub
    repository:
      owner: imohiyoko
      name: homebrew-devhub
      branch: main
      token: "{{ index .Env \"HOMEBREW_TAP_GITHUB_TOKEN\" }}"
    homepage: "https://github.com/imohiyoko/devhub"
    description: "ローカル開発補助ツールを localhost:8765 に集約するダッシュボード"
    # コミット作者（tap リポジトリへの自動コミット）。
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    # Caskとして登録するバイナリファイル名
    binaries:
      - devhub
    # 環境変数がない（ローカル実行や未設定）場合はアップロードをスキップする
    skip_upload: "{{ not (index .Env \"HOMEBREW_TAP_GITHUB_TOKEN\") }}"
    # 未署名バイナリが Gatekeeper にブロックされないよう quarantine 属性を除去する。
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/devhub"]
          end

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: imohiyoko
    name: devhub
  draft: false
  prerelease: auto # pre-release tags (e.g. v1.0.0-rc1) are flagged automatically
  # Release ページ自体を「導入手順つきダウンロードページ」にする。各リリースに
  # このバージョンへ固定したインストールコマンドを載せる（{{ .Tag }} = vX.Y.Z）。
  footer: |
    ## インストール

    **macOS / Linux**
    ```bash
    DEVHUB_VERSION={{ .Tag }} /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/imohiyoko/devhub/main/install.sh)"
    ```

    **Windows (PowerShell)**
    ```powershell
    $env:DEVHUB_VERSION="{{ .Tag }}"; powershell -NoProfile -ExecutionPolicy Bypass -Command "iwr -useb https://raw.githubusercontent.com/imohiyoko/devhub/main/install.ps1 | iex"
    ```

    インストーラは下の資産を `checksums.txt`（SHA256）で検証してから配置します。手動の場合は資産と `checksums.txt` を取得し、ハッシュを照合してから展開してください。

    `checksums.txt` は cosign で keyless 署名しています。sigstore bundle（`checksums.txt.sigstore.json`）に加え、移行期間中は従来形式（`checksums.txt.sig` / `checksums.txt.pem`）も添付します。`DEVHUB_VERIFY_SIGNATURE=1` を付けてインストーラを実行すると、リリースワークフロー由来であることを署名でも検証します（要 `cosign`。v3 以降は bundle、v2 は `.sig`/`.pem` で自動的に検証されます）。手動検証:

    cosign v3 以降:
    ```bash
    cosign verify-blob \
      --bundle checksums.txt.sigstore.json \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      --certificate-identity-regexp '^https://github.com/imohiyoko/devhub/\.github/workflows/release\.yml@refs/(heads/main$|tags/v[0-9])' \
      checksums.txt
    ```

    cosign v2:
    ```bash
    cosign verify-blob \
      --certificate checksums.txt.pem --signature checksums.txt.sig \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      --certificate-identity-regexp '^https://github.com/imohiyoko/devhub/\.github/workflows/release\.yml@refs/(heads/main$|tags/v[0-9])' \
      checksums.txt
    ```

